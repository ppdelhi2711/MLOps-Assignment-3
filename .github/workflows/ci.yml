
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint with flake8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt flake8

      - name: Run flake8
       run: flake8 src/ --max-line-length=120 --ignore=E501,W503,E251,E221,W291,W293,E302,E305,E303,E226,E241,E231,E202,E201,E128,E127,F401
